{# Sidebar compartido entre dashboard.html y edit_bot.html #}
<aside class="sidebar">
    <div class="brand">
        <span class="brand-mark">⭐</span>
        Staff Estelar
    </div>

    <nav class="nav">
        <a class="nav-item {{ 'active' if active_nav == 'dashboard' else '' }}" href="/dashboard">
            <span class="ico">🗂️</span> Dashboard
        </a>
        <span class="nav-item disabled" title="Próximamente">
            <span class="ico">📜</span> Logs
        </span>
        <span class="nav-item disabled" title="Próximamente">
            <span class="ico">⚙️</span> Configuración
        </span>
    </nav>

    <div class="sidebar-footer">
        <div class="theme-toggle">
            <button type="button" data-theme-btn="light">☀️ Claro</button>
            <button type="button" data-theme-btn="dark">🌙 Oscuro</button>
        </div>
        <div class="user-chip">
            <span class="user-avatar">{{ (username or "A")[0] | upper }}</span>
            <span>{{ username }}</span>
        </div>
        <a class="salir" href="/logout">Cerrar sesión</a>
    </div>
</aside>
